# pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
  - repo: local
    hooks:
      - id: verify-clean
        name: no original-family strings
        entry: python scripts/verify_clean.py --quiet
        language: system
        pass_filenames: false
      - id: lint-agents
        name: agent definitions are well formed
        entry: python scripts/lint_agents.py
        language: system
        pass_filenames: false
