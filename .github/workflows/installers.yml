name: Installers

# The one-click downloads for families: the Windows setup (.exe) and the Mac app (.dmg + .zip, Apple silicon and Intel).
# Built from the tag on a published release and attached to it. The release's SHA256SUMS / SHA256SUMS.sig
# (RELEASING.md) are still made and uploaded by the maintainer.
# Cost rules (RELEASING.md "Keeping CI cheap"): macOS minutes are billed 10x, so the Mac app is built automatically only
# for a minor release (vX.Y.0) or when the release notes contain [mac]; a Mac that is already installed updates itself
# (onboard.py update), so a patch release needs no new dmg. Any other build: Actions > Installers > Run workflow, with
# "tag" set to attach it to that release (empty = build HEAD as workflow artifacts only). With the repository variable
# MAC_RUNNER = self the Mac job runs on the maintainer's own Mac (self-hosted runner, no minutes billed). Self-hosted
# jobs run only for releases and manual runs, never for a pull request (this workflow has no pull_request trigger).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (empty: HEAD, artifacts only)"
        type: string
        default: ""
      windows:
        description: "Build the Windows setup"
        type: boolean
        default: true
      mac:
        description: "Build the Mac app (macOS is billed 10x)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  REF: ${{ github.event.release.tag_name || inputs.tag || 'HEAD' }}
  ATTACH: ${{ github.event_name == 'release' || inputs.tag != '' }}

jobs:
  windows:
    if: github.event_name == 'release' || inputs.windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: choco install innosetup -y --no-progress
      - run: python installer/build_installer.py --ref ${{ env.REF }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/installer/*.exe
          retention-days: 7
      - if: env.ATTACH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ env.REF }} (Get-ChildItem dist/installer/*.exe).FullName --clobber

  mac:
    if: >-
      (github.event_name == 'release' && (endsWith(github.event.release.tag_name, '.0') || contains(github.event.release.body, '[mac]')))
      || (github.event_name == 'workflow_dispatch' && inputs.mac)
    # The maintainer's own Mac (a self-hosted runner labelled macOS, free) when the repository variable MAC_RUNNER is
    # "self"; GitHub's macOS runner (billed 10x) otherwise, e.g. while that Mac is away. See RELEASING.md.
    runs-on: ${{ vars.MAC_RUNNER == 'self' && fromJSON('["self-hosted","macOS"]') || 'macos-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # setup-python's installer creates /Users/runner (GitHub's runner home), which fails on the maintainer's Mac:
      # there the Homebrew Python 3.13 runs in a throwaway venv instead.
      - if: runner.environment != 'self-hosted'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Use this Mac's Python 3.13
        if: runner.environment == 'self-hosted'
        run: |
          PY=/opt/homebrew/bin/python3.13
          [ -x "$PY" ] || { echo "Python 3.13 is missing on this Mac: brew install python@3.13"; exit 1; }
          "$PY" -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install pillow
      # On the maintainer's Mac: the Developer ID already in its login keychain and the notary profile stored there
      # (vars.MAC_NOTARY_PROFILE); no certificate or password is copied anywhere and the keychains are left as they are.
      - name: Use this Mac's own signing identity
        if: runner.environment == 'self-hosted'
        run: |
          ID="$(security find-identity -v -p codesigning | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$ID" ]; then echo "no Developer ID Application identity on this Mac: unsigned build"; exit 0; fi
          echo "MAC_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
      # GitHub's runner: Developer ID signing + notarization when the repo has the Apple secrets; otherwise unsigned.
      - name: Import the signing certificate
        if: runner.environment != 'self-hosted'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then echo "no signing secrets: unsigned build"; exit 0; fi
          KC="$RUNNER_TEMP/sign.keychain-db"; PW="$(uuidgen)"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PW" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          ID="$(security find-identity -v -p codesigning "$KC" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          [ -n "$ID" ] || { echo "no Developer ID Application identity in the certificate"; exit 1; }
          echo "MAC_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
      - run: python installer/build_mac.py --dmg --ref ${{ env.REF }}
        env:
          MAC_NOTARY_PROFILE: ${{ runner.environment == 'self-hosted' && vars.MAC_NOTARY_PROFILE || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v7
        with:
          name: mac-app
          path: |
            dist/installer/*.dmg
            dist/installer/*.zip
          retention-days: 7
      - if: env.ATTACH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ env.REF }}" dist/installer/*.dmg dist/installer/*.zip --clobber
